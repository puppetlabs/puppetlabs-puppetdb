name: "nightly"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  Spec:
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_ci.yml@main"
    secrets: "inherit"

  Acceptance:
    needs: Spec
    uses: "puppetlabs/cat-github-actions/.github/workflows/module_acceptance.yml@main"
    secrets: "inherit"
    with:
      flags: "--collection-platform-exclude 9:Debian-12 --collection-platform-exclude 8:SLES-15 --collection-platform-exclude 9:SLES-15 --collection-platform-exclude 8:RedHat-8 --collection-platform-exclude 9:RedHat-8 --collection-platform-exclude 8:RedHat-9 --collection-platform-exclude 9:RedHat-9 --collection-platform-exclude 8:RedHat-10 --collection-platform-exclude 9:RedHat-10 --arch-exclude arm"
      runs_on: "ubuntu-24.04"
